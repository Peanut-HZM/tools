# Alembic 配置文件
# 用于数据库迁移管理

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件
template = generic

# 数据库连接 URL
# 从环境变量 DATABASE_URL 读取（见 alembic/env.py）
# 此处占位符仅用于语法正确性，实际连接由环境变量控制
sqlalchemy.url = ${DATABASE_URL:driver://user:pass@localhost/dbname}

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
