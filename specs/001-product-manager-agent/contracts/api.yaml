openapi: 3.0.3
info:
  title: 产品经理 Agent API
  version: 1.0.0
  description: 智能产品需求分析与PRD生成助手的API契约

servers:
  - url: /api/v1

paths:
  # ========== 会话管理 ==========
  /conversations:
    get:
      summary: 获取会话列表
      tags:
        - 会话管理
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
    
    post:
      summary: 创建新会话
      tags:
        - 会话管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initial_message:
                  type: string
                  description: 用户的第一条消息
      responses:
        '201':
          description: 会话创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '429':
          description: 达到会话创建限制

  /conversations/{conversation_id}:
    get:
      summary: 获取会话详情
      tags:
        - 会话管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: 会话不存在
    
    put:
      summary: 更新会话（乐观锁）
      tags:
        - 会话管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                version:
                  type: integer
                  description: 当前版本号（用于乐观锁）
      responses:
        '200':
          description: 更新成功
        '409':
          description: 版本冲突
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "版本冲突，请刷新后重试"
                  current_version:
                    type: integer
    
    delete:
      summary: 删除会话
      tags:
        - 会话管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功

  # ========== 消息管理 ==========
  /conversations/{conversation_id}/messages:
    get:
      summary: 获取会话消息列表
      tags:
        - 消息管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: before_id
          in: query
          schema:
            type: string
            format: uuid
          description: 获取此消息之前的消息（分页）
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  has_more:
                    type: boolean
    
    post:
      summary: 发送消息并获取AI响应
      tags:
        - 消息管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: 用户消息内容
                action:
                  type: string
                  enum: [chat, analyze_competitor, generate_prd, export]
                  description: 用户请求的动作类型
      responses:
        '200':
          description: 消息发送成功，返回AI响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_message:
                    $ref: '#/components/schemas/Message'
                  agent_message:
                    $ref: '#/components/schemas/Message'
                  stage_changed:
                    type: boolean
                  new_stage:
                    type: string
        '429':
          description: 达到API调用限制
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "您已达到本小时的调用上限，请稍后重试"
                  reset_time:
                    type: string
                    format: date-time
                  remaining_minutes:
                    type: integer

  # ========== PRD管理 ==========
  /conversations/{conversation_id}/prd:
    get:
      summary: 获取会话的所有PRD版本
      tags:
        - PRD管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PRD版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PRDDocument'
    
    post:
      summary: 生成新PRD版本
      tags:
        - PRD管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sections:
                  type: array
                  items:
                    type: string
                  description: 指定要生成的章节（不传则生成完整PRD）
      responses:
        '201':
          description: PRD生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDDocument'

  /conversations/{conversation_id}/prd/{version_number}:
    get:
      summary: 获取指定版本的PRD
      tags:
        - PRD管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: PRD详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRDDocument'
    
    put:
      summary: 更新PRD状态
      tags:
        - PRD管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, confirmed, archived]
      responses:
        '200':
          description: 状态更新成功

  /conversations/{conversation_id}/prd/compare:
    post:
      summary: 对比两个PRD版本
      tags:
        - PRD管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_version:
                  type: integer
                to_version:
                  type: integer
      responses:
        '200':
          description: 版本对比结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_version:
                    type: integer
                  to_version:
                    type: integer
                  diff:
                    type: string
                    description: diff格式的差异内容

  /conversations/{conversation_id}/prd/export:
    post:
      summary: 导出PRD
      tags:
        - PRD管理
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version_number:
                  type: integer
                format:
                  type: string
                  enum: [markdown, pdf, word]
                  description: 导出格式
      responses:
        '200':
          description: 导出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    format: uri

  # ========== 竞品分析 ==========
  /conversations/{conversation_id}/competitors:
    get:
      summary: 获取竞品分析结果
      tags:
        - 竞品分析
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 竞品分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitorAnalysis'
    
    post:
      summary: 执行竞品分析
      tags:
        - 竞品分析
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 分析任务已提交（异步处理）
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    example: "processing"

  # ========== 大模型配置（管理员） ==========
  /admin/llm-configs:
    get:
      summary: 获取所有大模型配置
      tags:
        - 大模型配置（管理员）
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LLMConfig'
    
    post:
      summary: 创建大模型配置
      tags:
        - 大模型配置（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMConfigCreate'
      responses:
        '201':
          description: 配置创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfig'

  /admin/llm-configs/{config_id}:
    get:
      summary: 获取配置详情
      tags:
        - 大模型配置（管理员）
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 配置详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfig'
    
    put:
      summary: 更新配置
      tags:
        - 大模型配置（管理员）
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMConfigCreate'
      responses:
        '200':
          description: 更新成功
    
    delete:
      summary: 删除配置
      tags:
        - 大模型配置（管理员）
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功

  /admin/llm-configs/{config_id}/test:
    post:
      summary: 测试配置连接
      tags:
        - 大模型配置（管理员）
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 连接测试结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  latency_ms:
                    type: integer

  /admin/llm-configs/{config_id}/set-default:
    post:
      summary: 设置为默认配置
      tags:
        - 大模型配置（管理员）
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 设置成功

  /admin/llm-stats:
    get:
      summary: 获取大模型调用统计
      tags:
        - 大模型配置（管理员）
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 统计信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_calls:
                    type: integer
                  avg_latency_ms:
                    type: integer
                  total_tokens:
                    type: integer
                  error_rate:
                    type: number
                    format: float
                  by_provider:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        calls:
                          type: integer

  # ========== 限流配置（管理员） ==========
  /admin/rate-limits:
    get:
      summary: 获取限流配置
      tags:
        - 限流配置（管理员）
      responses:
        '200':
          description: 限流配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  normal_user:
                    type: object
                    properties:
                      hourly_limit:
                        type: integer
                  premium_user:
                    type: object
                    properties:
                      hourly_limit:
                        type: integer
    
    put:
      summary: 更新限流配置
      tags:
        - 限流配置（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                normal_user:
                  type: object
                  properties:
                    hourly_limit:
                      type: integer
                premium_user:
                  type: object
                  properties:
                    hourly_limit:
                      type: integer
      responses:
        '200':
          description: 更新成功

components:
  schemas:
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        current_stage:
          type: string
          enum: [requirement_clarification, market_research, architecture_design, detailed_design, integration_output]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_type:
          type: string
          enum: [user, agent]
        content:
          type: string
        message_type:
          type: string
          enum: [text, structured, chart]
        sent_at:
          type: string
          format: date-time
    
    PRDDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        version_number:
          type: integer
        content:
          type: string
        status:
          type: string
          enum: [draft, confirmed, archived]
        created_at:
          type: string
          format: date-time
    
    CompetitorAnalysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        competitors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              core_features:
                type: array
                items:
                  type: string
              pros:
                type: array
                items:
                  type: string
              cons:
                type: array
                items:
                  type: string
              opportunity:
                type: string
        differentiation_suggestions:
          type: string
        created_at:
          type: string
          format: date-time
    
    LLMConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          type: string
          enum: [openai, anthropic, azure_openai, baidu, aliyun, other]
        base_url:
          type: string
        model_name:
          type: string
        request_params:
          type: object
        is_default:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    
    LLMConfigCreate:
      type: object
      required:
        - name
        - provider_type
        - base_url
        - api_key
        - model_name
      properties:
        name:
          type: string
        provider_type:
          type: string
          enum: [openai, anthropic, azure_openai, baidu, aliyun, other]
        base_url:
          type: string
        api_key:
          type: string
          description: API Key（明文，后端加密存储）
        model_name:
          type: string
        request_params:
          type: object
          properties:
            temperature:
              type: number
            max_tokens:
              type: integer
            timeout:
              type: integer
        is_default:
          type: boolean
        is_active:
          type: boolean
