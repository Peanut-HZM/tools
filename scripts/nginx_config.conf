# Nginx配置文件模板
# 部署到服务器后，需要根据实际情况修改并放置到 /etc/nginx/sites-available/tools.peanuthzm.com.cn

# 前端配置
server {
    listen 80;
    server_name tools.peanuthzm.com.cn;
    
    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tools.peanuthzm.com.cn;

    # SSL证书配置（certbot会自动配置）
    ssl_certificate /etc/letsencrypt/live/tools.peanuthzm.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.peanuthzm.com.cn/privkey.pem;
    
    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    # ssl_session_cache 已在主配置文件中定义，此处注释避免冲突
    ssl_session_timeout 10m;

    # 前端静态文件
    root /data/www/tools;
    index index.html;

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API代理到后端
    location /api {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 文件上传大小限制
    client_max_body_size 100M;

    # 日志
    access_log /var/log/nginx/tools_access.log;
    error_log /var/log/nginx/tools_error.log;
}
