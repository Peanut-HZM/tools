# Nginx 配置文件
# 部署到服务器后放置到 /etc/nginx/sites-available/tools.peanuthzm.com.cn
# 然后 ln -s /etc/nginx/sites-available/tools.peanuthzm.com.cn /etc/nginx/sites-enabled/

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name tools.peanuthzm.com.cn;

    # ACME 验证路径（certbot 自动添加，勿删）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name tools.peanuthzm.com.cn;

    # SSL 证书（certbot --nginx 会自动填充实际路径）
    ssl_certificate /etc/letsencrypt/live/tools.peanuthzm.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.peanuthzm.com.cn/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态文件
    root /data/www/tools;
    index index.html;

    # 前端路由（SPA 回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（js/css/图片/字体）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # API 代理到后端（常规请求）
    # ========================================
    location /api/ {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（默认 60s）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================
    # WebSocket 代理（K8s 控制台 / SSH 终端）
    # ========================================
    # K8s WebSocket: /api/k8s-tool/{configId}/ws/...
    location /api/k8s-tool/ {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket 长超时（默认 30 分钟，与后端 K8S_WS_IDLE_TIMEOUT 一致）
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # SSH WebSocket: /api/ssh-tool/ws
    location /api/ssh-tool/ws {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSH 会话长超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ========================================
    # SSE 流式响应（OpenClaw 聊天 / Product Manager Agent）
    # ========================================
    location /api/openclaw/chat {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # SSE 长超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 文件上传大小限制
    client_max_body_size 100M;

    # 日志
    access_log /var/log/nginx/tools_access.log;
    error_log /var/log/nginx/tools_error.log;
}
