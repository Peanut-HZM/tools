# Alembic configuration file
# Database migration management

[alembic]
# Migration scripts directory
script_location = alembic

# Template file
template = generic

# Database connection URL
# Read from env var DATABASE_URL (see alembic/env.py)
# Placeholder here for syntax correctness only
# sqlalchemy.url is set programmatically in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
