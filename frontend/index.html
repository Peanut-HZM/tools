<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>工具箱 - 聚合类工具网站</title>

    <!-- 主题引导内联脚本：首帧渲染前同步 data-theme，消除亮色用户刷新时的暗色闪烁（FOUC）。
         语义与 src/lib/theme.tsx 保持一致：localStorage key 'tk-theme'，
         值 dark|light|system，默认 dark；仅显式 'system' 时按系统偏好解析，
         未存储/空值/无效值一律回退默认 dark（对应 theme.tsx 的 || DEFAULT_THEME）。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tk-theme');
          if (t !== 'light' && t !== 'dark') {
            // 仅显式 'system' 读取系统偏好；其余（null/''/无效值）回退默认 dark
            t = (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          // localStorage 不可用（隐私模式等）时回退默认 dark
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Geist Sans + Geist Mono (Vercel, 通过 Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- HarmonyOS Sans SC / Noto Serif SC / Pacifico 外链已移除：
         HarmonyOS Sans SC 不在 Google Fonts（实际 404）；
         Noto Serif SC 无业务使用（仅 dev 验证页，走系统衬线 fallback）；
         Pacifico 由系统字体栈 font-extrabold 替代。 -->
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
