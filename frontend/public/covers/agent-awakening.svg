<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/>
      <stop offset="0.55" stop-color="#3b1d78"/>
      <stop offset="1" stop-color="#140b2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.88" r="0.45">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- 智能体循环母题：感知 → 规划 → 执行 → 反思 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <g transform="translate(930,190)">
      <circle r="62" fill="#2e1065" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.8"/>
      <text text-anchor="middle" y="-8" font-size="24" fill="#ddd6fe" font-weight="bold">感知</text>
      <text text-anchor="middle" y="24" font-size="15" fill="#a78bfa">Perceive</text>
    </g>
    <g transform="translate(1090,330)">
      <circle r="62" fill="#2e1065" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.8"/>
      <text text-anchor="middle" y="-8" font-size="24" fill="#ddd6fe" font-weight="bold">规划</text>
      <text text-anchor="middle" y="24" font-size="15" fill="#a78bfa">Plan</text>
    </g>
    <g transform="translate(930,470)">
      <circle r="62" fill="#2e1065" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.8"/>
      <text text-anchor="middle" y="-8" font-size="24" fill="#ddd6fe" font-weight="bold">执行</text>
      <text text-anchor="middle" y="24" font-size="15" fill="#a78bfa">Act</text>
    </g>
    <g transform="translate(760,330)">
      <circle r="62" fill="#2e1065" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.9"/>
      <text text-anchor="middle" y="-8" font-size="24" fill="#fbcfe8" font-weight="bold">反思</text>
      <text text-anchor="middle" y="24" font-size="15" fill="#f472b6">Reflect</text>
    </g>
    <g stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.75" fill="none">
      <path d="M 975 150 L 1055 280" marker-end="url(#arrow)"/>
      <path d="M 1080 396 L 985 425" marker-end="url(#arrow)"/>
      <path d="M 868 420 L 800 390" marker-end="url(#arrow)"/>
      <path d="M 800 268 L 872 230" marker-end="url(#arrow)"/>
    </g>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#c4b5fd"/>
      </marker>
    </defs>
    <text x="930" y="580" text-anchor="middle" font-size="19" fill="#a78bfa" opacity="0.9">Agent Loop</text>
  </g>

  <!-- 左侧文字区 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <rect x="80" y="120" width="176" height="40" rx="20" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="168" y="147" text-anchor="middle" font-size="19" fill="#c4b5fd" letter-spacing="2">AI 觉醒系列 · 02</text>

    <text x="80" y="268" font-size="66" font-weight="bold" fill="#f5f3ff">智能体入门</text>
    <text x="80" y="348" font-size="34" fill="#ddd6fe">AI 的觉醒时刻</text>

    <rect x="82" y="388" width="230" height="6" rx="3" fill="url(#bar)"/>

    <text x="80" y="452" font-size="22" fill="#b8a7d9">工具调用 · 记忆系统 · 规划反思 · ReAct</text>
    <text x="80" y="490" font-size="22" fill="#b8a7d9">多智能体协作 · MCP 协议 · 实战拆解</text>

    <text x="80" y="580" font-size="20" fill="#cbd5e1">📚 6 个章节 · ⏱ 115 分钟 · ✍️ 每章配测验</text>
    <text x="80" y="622" font-size="19" fill="#6b5b95">建议先修《大模型基础》</text>
  </g>

  <g transform="translate(1050,585)">
    <circle r="42" fill="#170b30" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"/>
    <text text-anchor="middle" y="9" font-size="28">🤖</text>
  </g>
</svg>
